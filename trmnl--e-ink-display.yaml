# This panel treats pure black as "no ink" and anything else as "ink", so the
# values below are deliberately swapped relative to their names.
color:
  - id: paper_white
    hex: "000000"
  - id: paper_black
    hex: "FFFFFF"

# define SPI interface
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2p
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    auto_clear_enabled: false
    update_interval: never
    full_update_every: 4

lvgl:
  displays:
    - epaper
  buffer_size: 25%
  color_depth: 16
  default_font: font_small
  on_draw_end:
    - component.update: epaper
  style_definitions:
    # Panels sit edge to edge, so each one only draws the sides that are not
    # already drawn by its neighbour. That keeps every line on the screen a
    # single 2px stroke instead of two borders stacked next to each other.
    - id: panel_style
      bg_color: paper_white
      bg_opa: COVER
      border_color: paper_black
      border_width: 2
      radius: 0
      pad_all: 4
  bottom_layer:
    bg_color: paper_white
    bg_opa: COVER
  pages:
    - id: main_page
      bg_color: paper_white
      bg_opa: COVER
      widgets:
        # Time / date panel. No padding, so the day-of-week strip can run the
        # full width of the panel and let its cell borders line up with the
        # panel borders instead of floating inside them.
        - obj:
            x: 0
            y: 0
            width: 200
            height: 160
            styles: panel_style
            border_side: [TOP, BOTTOM, LEFT, RIGHT]
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_time
                  align: TOP_MID
                  y: 4
                  text_font: font_big
                  text_color: paper_black
                  text: "--:--"
              - label:
                  id: lbl_date
                  align: TOP_MID
                  y: 74
                  text_font: font_small
                  text_color: paper_black
                  text: "---"
              # Day-of-week strip, flush with the bottom of the panel. The cells
              # only draw their top and right edges, so together they form one
              # horizontal rule with dividers, and the panel's own borders close
              # off the row. The widths add up to the 196px of content width.
              - obj:
                  x: 0
                  y: 122
                  width: 100%
                  height: 34
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_column: 0
                  widgets:
                    - label:
                        id: day_mon
                        width: 26
                        height: 34
                        bg_color: paper_white
                        bg_opa: COVER
                        border_color: paper_black
                        border_width: 2
                        border_side: [TOP, RIGHT]
                        radius: 0
                        pad_top: 2
                        text_font: font_header
                        text_color: paper_black
                        text_align: CENTER
                        text: "M"
                    - label:
                        id: day_tue
                        width: 26
                        height: 34
                        bg_color: paper_white
                        bg_opa: COVER
                        border_color: paper_black
                        border_width: 2
                        border_side: [TOP, RIGHT]
                        radius: 0
                        pad_top: 2
                        text_font: font_header
                        text_color: paper_black
                        text_align: CENTER
                        text: "T"
                    - label:
