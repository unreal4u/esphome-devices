substitutions:
  device_name: trmnl-e-ink-display-1
  device_friendly_name: TRMNL - e-ink Display
  device_comment: E-ink display

packages:
  basics: !include .basics.yaml

esphome:
  includes:
    - src/calendar_structs.h
    - src/calendar_structs.cpp
  on_boot:
    # Enable the battery divider early so the first ADC sample is valid
    - priority: 600
      then:
        - script.execute: sample_battery
    - priority: -100
      then:
        # Give Home Assistant a moment to push the initial sensor states
        - delay: 20s
        - script.execute: update_dashboard

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

# Enable Home Assistant API
api:
  encryption:
    key: !secret apikey_eink_display1
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret otapwd_eink_display1

# Sets the time on the device based on the information coming from HA
time:
  - platform: sntp
    id: local_time
    # Denotes Amsterdam: https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv
    #timezone: CET-1CEST,M3.5.0,M10.5.0/3
    timezone: Europe/Amsterdam
    servers:
      - ntp.home.unreal4u.com
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time:
      # Refresh the e-paper once per minute at HH:MM:01
      - seconds: 1
        then:
          - script.execute: update_dashboard

text_sensor:
  - platform: homeassistant
    id: active_tariff_sensor
    name: "Active Tariff"
    entity_id: sensor.p1_meter_dongle_current_tariff_parsed
    on_value:
      then:
        - script.execute: request_dashboard_update

  # Possible states: sunny, clear, partlycloudy, cloudy, partlycloudy-fog, partlycloudy-light-rain, partlycloudy-rain, light-rain, rainy, snowy-rainy, partlycloudy-light-snow, partlycloudy-snow, light-snow, snowy, partlycloudy-lightning or lightning
  - platform: homeassistant
    entity_id: weather.buienradar
    name: "Weather buienradar"
    id: outside_weather

  - platform: homeassistant
    entity_id: fan.kelder_controller_fan
    name: "Fan Kelder"
    id: fan_kelder
    on_value:
      then:
        - script.execute: request_dashboard_update

  - platform: homeassistant
    entity_id: binary_sensor.door_sensor_1_contact
    name: "Back door opened"
    id: back_door_open
    on_value:
      then:
        - script.execute: request_dashboard_update

  - platform: homeassistant
    entity_id: input_boolean.water_fountain_must_be_cleaned
    name: "Water fountain needs cleaning"
    id: water_fountain_must_be_cleaned
    on_value:
      then:
        - script.execute: request_dashboard_update

  - platform: homeassistant
    entity_id: input_boolean.dark_mode
    name: "Dark mode"
    id: is_dark
    on_value:
      then:
        - script.execute: request_dashboard_update

  - platform: homeassistant
    entity_id: input_boolean.night_mode
    name: "Night mode"
    id: is_night
    on_value:
      then:
        - script.execute: request_dashboard_update

  - platform: homeassistant
    entity_id: binary_sensor.f1_race_week
    name: "F1 race week"
    id: f1_race_week
    on_value:
      then:
        - script.execute: request_dashboard_update

sensor:
  - platform: homeassistant
    id: outside_temperature
    name: "Outside Temperature"
    entity_id: sensor.buienradar_temperature
  - platform: homeassistant
    entity_id: sensor.temperature_downstairs
    name: "Downstairs temperature"
    id: downstairs_temperature
  - platform: homeassistant
    entity_id: sensor.outside_box_temperature
    name: "Bedroom temperature"
    id: bedroom_temperature
  - platform: homeassistant
    entity_id: number.number_of_lights_on
    name: "Number of lights on"
    id: number_of_lights_on
    on_value:
      then:
        - script.execute: request_dashboard_update
  - platform: homeassistant
    entity_id: counter.vacuum_runs_without_cleaning
    name: "Vacuum runs without cleaning"
    id: vacuum_runs_without_cleaning
    on_value:
      then:
        - script.execute: request_dashboard_update
  - platform: homeassistant
    entity_id: sensor.k1c_ef19_progress
    name: "Printer progress"
    id: printer_progress
    on_value:
      then:
        - script.execute: request_dashboard_update

  # TRMNL OG DIY kit: GPIO1 senses battery through a 2x divider, GPIO6 enables it
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

  - platform: template
    name: "Battery Level"
    id: battery_level
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery
    update_interval: never
    lambda: 'return id(battery_voltage).state;'
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      then:
        # The strip shows a whole percentage below 90%, so refresh when that
        # number changes and when the slot appears or clears. -1 means hidden.
        - if:
            condition:
              lambda: |-
                static int last_shown = -1;
                int shown = (!isnan(x) && x < 90.0f) ? (int) roundf(x) : -1;
                bool changed = shown != last_shown;
                last_shown = shown;
                return changed;
            then:
              - script.execute: request_dashboard_update

# GPIO6 gates the battery voltage divider; leave it off between samples
output:
  - platform: gpio
    pin: GPIO6
    id: battery_adc_enable

globals:
  # Minute currently drawn on the panel, -1 when the panel holds an unsynced time
  - id: last_rendered_minute
    type: int
    restore_value: false
    initial_value: '-1'

script:
  # Turn the divider on just long enough to take a stable ADC reading
  - id: sample_battery
    mode: single
    then:
      - output.turn_on: battery_adc_enable
      - delay: 50ms
      - component.update: battery_voltage
      - component.update: battery_level
      - output.turn_off: battery_adc_enable

  # Coalesce related Home Assistant state changes into one e-paper refresh.
  # Restart mode resets the short delay whenever another notification changes.
  - id: request_dashboard_update
    mode: restart
    then:
      - delay: 500ms
      - script.execute: update_dashboard

  - id: update_dashboard
    mode: single
    then:
      - logger.log:
          tag: "dashboard"
          format: "Refreshing dashboard (%d calendar events)"
          args: ['global_events.size()']
      - lambda: |-
          auto now_time = id(local_time).now();
          id(last_rendered_minute) = now_time.is_valid() ? (int) now_time.minute : -1;
      - lvgl.label.update:
          id: lbl_time
          text:
            time_format: "%H:%M"
            time: local_time
      - lvgl.label.update:
          id: lbl_date
          text:
            time_format: "\U000F00ED %d-%m-%y"
            time: local_time
      # Invert the cell of the current weekday. Like the rest of this panel the
      # colours are swapped: 0x000000 is blank paper, 0xFFFFFF is ink.
      - lambda: |-
          lv_obj_t *day_cells[7] = {
            id(day_mon), id(day_tue), id(day_wed), id(day_thu), id(day_fri), id(day_sat), id(day_sun),
          };
          auto now_time = id(local_time).now();
          if (!now_time.is_valid()) {
            return;
          }
          lv_color_t paper = lv_color_hex(0x000000);
          lv_color_t ink = lv_color_hex(0xFFFFFF);
          // ESPTime counts day_of_week from 1 = Sunday, the strip starts on Monday
          int active_cell = (now_time.day_of_week + 5) % 7;
          for (int cell = 0; cell < 7; cell++) {
            bool is_today = cell == active_cell;
            lv_obj_set_style_bg_color(day_cells[cell], is_today ? ink : paper, LV_PART_MAIN);
            lv_obj_set_style_text_color(day_cells[cell], is_today ? paper : ink, LV_PART_MAIN);
          }
      - lvgl.label.update:
          id: lbl_weather_icon
          text: !lambda |-
            std::string weather_condition = id(outside_weather).state;
            // Cooldown and night mode both mean it is dark outside, so a clear
            // sky has to read as a moon instead of a sun. The overcast
            // conditions look the same either way and need no night variant.
            bool after_dark =
              id(is_night).state == "on" || id(is_dark).state == "on";
            if (weather_condition == "partlycloudy") {
              return after_dark ? "\U000F0F31" : "\U000F0595";
            } else if (weather_condition == "cloudy") {
              return "\U000F0590";
            } else if (weather_condition == "partlycloudy-fog" || weather_condition == "fog") {
              return "\U000F0591";
            } else if (weather_condition == "partlycloudy-light-rain" ||
                       weather_condition == "partlycloudy-rain" ||
                       weather_condition == "light-rain") {
              return "\U000F0F33";
            } else if (weather_condition == "rainy") {
              return "\U000F0597";
            } else if (weather_condition == "snowy-rainy") {
              return "\U000F067F";
            } else if (weather_condition == "partlycloudy-light-snow") {
              return "\U000F0F35";
            } else if (weather_condition == "partlycloudy-snow") {
              return "\U000F0F34";
            } else if (weather_condition == "light-snow") {
              return "\U000F0598";
            } else if (weather_condition == "snowy") {
              return "\U000F0F36";
            } else if (weather_condition == "partlycloudy-lightning") {
              return "\U000F0F32";
            } else if (weather_condition == "lightning") {
              return "\U000F0593";
            }
            return after_dark ? "\U000F0594" : "\U000F0599";
      - lvgl.label.update:
          id: lbl_outside_temp
          text:
            format: "%0.0f"
            args: ['id(outside_temperature).state']
      - lvgl.label.update:
          id: lbl_bedroom_temp
          text:
            format: "%0.1f"
            args: ['id(bedroom_temperature).state']
      - lvgl.label.update:
          id: lbl_downstairs_temp
          text:
            format: "%0.1f"
            args: ['id(downstairs_temperature).state']
      # Slot 1 permanently holds the electricity tariff, inverted while the
      # tariff is normal so that the expensive hours stand out. The rest of the
      # feed only lists what needs attention; night mode takes precedence over
      # dark mode, so those two never occupy separate slots at the same time.
      - lambda: |-
          // Permanent state lives in the right-hand strip as an icon over its
          // value. Tariff and lights are always there; everything else that
          // needs a caption lives in the worded feed on the left.
          lv_color_t paper = lv_color_hex(0x000000);
          lv_color_t ink = lv_color_hex(0xFFFFFF);

          bool low_tariff = id(active_tariff_sensor).state == "Low";
          // Low tariff is quiet: pylon plus the word. Normal tariff is the
          // expensive hours, so the same slot inverts around "€€€".
          lv_label_set_text(id(perm_tariff_icon), "\U000F0D3E");
          lv_label_set_text(id(perm_tariff_status), low_tariff ? "Low" : "€€€");
          lv_obj_set_style_bg_opa(id(perm_tariff_status),
                                  low_tariff ? LV_OPA_TRANSP : LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(perm_tariff_status), ink, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(perm_tariff_status),
                                      low_tariff ? ink : paper, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(perm_tariff_icon), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(perm_tariff_icon), ink, LV_PART_MAIN);

          int lights_on = isnan(id(number_of_lights_on).state)
            ? 0 : (int) id(number_of_lights_on).state;
          char lights_text[8];
          snprintf(lights_text, sizeof(lights_text), "%d", lights_on);
          lv_label_set_text(id(perm_lights_status), lights_text);

          // Battery only earns a permanent slot once it is worth acting on.
          // The icon steps with the charge so the strip reads at a glance.
          const float battery = id(battery_level).state;
          if (!isnan(battery) && battery < 90.0f) {
            const int pct = (int) roundf(battery);
            const char *battery_icon = "\U000F0083";  // alert, under 20%
            if (pct >= 80) {
              battery_icon = "\U000F0081";
            } else if (pct >= 70) {
              battery_icon = "\U000F0080";
            } else if (pct >= 60) {
              battery_icon = "\U000F007F";
            } else if (pct >= 50) {
              battery_icon = "\U000F007E";
            } else if (pct >= 40) {
              battery_icon = "\U000F007D";
            } else if (pct >= 30) {
              battery_icon = "\U000F007C";
            } else if (pct >= 20) {
              battery_icon = "\U000F007B";
            }
            char battery_text[8];
            snprintf(battery_text, sizeof(battery_text), "%d%%", pct);
            lv_label_set_text(id(perm_battery_icon), battery_icon);
            lv_label_set_text(id(perm_battery_status), battery_text);
            lv_obj_remove_flag(id(perm_battery), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(perm_battery_rule), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(perm_battery), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(perm_battery_rule), LV_OBJ_FLAG_HIDDEN);
          }

          lv_obj_t *notification_labels[8] = {
            id(notification_1), id(notification_2), id(notification_3),
            id(notification_4), id(notification_5), id(notification_6),
            id(notification_7), id(notification_8),
          };
          // The wide column only carries alerts that need words. The list is
          // built most-important-first so that on the rare occasion everything
          // fires at once, it is the tail that gets dropped.
          std::string notifications[8];
          int count = 0;

          if (id(back_door_open).state == "on") {
            notifications[count++] = "\U000F081B Back door open";
          }
          if (id(fan_kelder).state == "on") {
            notifications[count++] = "\U000F0210 Kelder fan";
          }
          if (!isnan(id(vacuum_runs_without_cleaning).state) &&
              id(vacuum_runs_without_cleaning).state > 1) {
            notifications[count++] = "\U000F070D Clean vacuum";
          }
          if (!isnan(id(printer_progress).state) &&
              id(printer_progress).state > 0 &&
              id(printer_progress).state < 100) {
            char printing[32];
            snprintf(printing, sizeof(printing), "\U000F0E5B Printing %0.0f%%",
                     id(printer_progress).state);
            notifications[count++] = printing;
          }
          if (id(is_night).state == "on") {
            notifications[count++] = "\U000F0594 Night mode";
          } else if (id(is_dark).state == "on") {
            notifications[count++] = "\U000F059A Dark mode";
          }
          if (id(water_fountain_must_be_cleaned).state == "on") {
            notifications[count++] = "\U000F096B Clean fountain";
          }
          if (id(f1_race_week).state == "on") {
            notifications[count++] = "\U000F07AC Rawe Ceek";
          }

          for (int slot = 0; slot < 8; slot++) {
            if (slot < count) {
              lv_label_set_text(notification_labels[slot], notifications[slot].c_str());
              lv_obj_remove_flag(notification_labels[slot], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(notification_labels[slot], LV_OBJ_FLAG_HIDDEN);
            }
          }
      # Fill one chronological agenda with up to seven events. Remaining events
      # for today come first, followed by tomorrow. Timed events disappear as
      # soon as their end time has passed; all-day events remain for the day.
      - lambda: |-
          constexpr int kSlots = 7;
          constexpr int kRowHeight = 56;
          constexpr int kEmptyTodayHeight = 58;  // 15px + "Nothing planned" + 15px
          constexpr int kTomorrowGap = 16;       // space between today and TOMORROW
          constexpr int kTomorrowHeaderHeight = 32;
          constexpr int kRailDotCentre = 13;     // row top to the middle of the dot
          lv_obj_t *slots[kSlots] = {
            id(cal_slot_1), id(cal_slot_2), id(cal_slot_3),
            id(cal_slot_4), id(cal_slot_5), id(cal_slot_6), id(cal_slot_7),
          };
          lv_obj_t *rails[kSlots] = {
            id(cal_rail_1), id(cal_rail_2), id(cal_rail_3),
            id(cal_rail_4), id(cal_rail_5), id(cal_rail_6), id(cal_rail_7),
          };
          lv_obj_t *rail_lines[kSlots] = {
            id(cal_line_1), id(cal_line_2), id(cal_line_3),
            id(cal_line_4), id(cal_line_5), id(cal_line_6), id(cal_line_7),
          };
          lv_obj_t *time_labels[kSlots] = {
            id(cal_time_1), id(cal_time_2), id(cal_time_3),
            id(cal_time_4), id(cal_time_5), id(cal_time_6), id(cal_time_7),
          };
          lv_obj_t *title_labels[kSlots] = {
            id(cal_title_1), id(cal_title_2), id(cal_title_3),
            id(cal_title_4), id(cal_title_5), id(cal_title_6), id(cal_title_7),
          };

          auto now_time = id(local_time).now();
          if (!now_time.is_valid()) {
            return;
          }
          const std::string today_date = now_time.strftime("%Y-%m-%d");
          const std::string tomorrow_date =
            ESPTime::from_epoch_local(now_time.timestamp + 86400).strftime("%Y-%m-%d");
          const std::string now_iso = now_time.strftime("%Y-%m-%dT%H:%M:%S");

          // A multi-day event has to appear on every day it covers, so match on
          // the date range instead of on the event's start date alone. Home
          // Assistant reports the end date of all-day events exclusively.
          auto occurs_on = [](const CalendarEvent &event, const std::string &date) {
            if (event.start.length() < 10 || event.end.length() < 10 || event.start.substr(0, 10) > date) {
              return false;
            }
            bool all_day = event.start.length() <= 11 || event.start[10] != 'T';
            return all_day ? date < event.end.substr(0, 10) : date <= event.end.substr(0, 10);
          };

          auto timed_event_has_ended = [&now_iso](const CalendarEvent &event) {
            bool timed = event.start.length() > 11 && event.start[10] == 'T';
            if (!timed || event.end.length() < 16 || event.end[10] != 'T') {
              return false;
            }
            size_t comparable_length = event.end.length() >= 19 ? 19 : event.end.length();
            return event.end.substr(0, comparable_length) <=
                   now_iso.substr(0, comparable_length);
          };

          // Keep each day sorted independently. ISO timestamps sort
          // chronologically as plain strings, with all-day events before timed
          // events on the same date.
          const CalendarEvent *today_events[kSlots] = {};
          const CalendarEvent *tomorrow_events[kSlots] = {};
          int today_count = 0;
          int tomorrow_count = 0;
          auto insert_event = [&](const CalendarEvent *event,
                                  const CalendarEvent **events, int &count) {
            int position = count;
            while (position > 0 && events[position - 1]->start > event->start) {
              position--;
            }
            if (position >= kSlots) {
              return;
            }
            for (int i = (count < kSlots ? count : kSlots - 1); i > position; i--) {
              events[i] = events[i - 1];
            }
            events[position] = event;
            if (count < kSlots) {
              count++;
            }
          };

          for (const auto &event : global_events) {
            if (occurs_on(event, today_date) && !timed_event_has_ended(event)) {
              insert_event(&event, today_events, today_count);
            }
            if (occurs_on(event, tomorrow_date)) {
              insert_event(&event, tomorrow_events, tomorrow_count);
            }
          }

          int today_shown = today_count;
          int tomorrow_shown = tomorrow_count;
          if (today_shown > kSlots) {
            today_shown = kSlots;
          }
          if (tomorrow_shown > kSlots - today_shown) {
            tomorrow_shown = kSlots - today_shown;
          }

          // No TODAY header: events start at the top. When today is empty the
          // centred placeholder reserves a little vertical room so TOMORROW
          // does not jump up against the panel edge.
          const int today_block_height =
            today_shown > 0 ? today_shown * kRowHeight : kEmptyTodayHeight;
          if (today_shown > 0) {
            lv_obj_add_flag(id(cal_today_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(cal_today_empty), LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(cal_tomorrow_header_text), "TOMORROW");
          lv_obj_set_y(id(cal_tomorrow_header), today_block_height + kTomorrowGap);
          if (tomorrow_shown > 0) {
            lv_obj_add_flag(id(cal_tomorrow_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_set_y(id(cal_tomorrow_empty),
                         today_block_height + kTomorrowGap + kTomorrowHeaderHeight);
            lv_obj_remove_flag(id(cal_tomorrow_empty), LV_OBJ_FLAG_HIDDEN);
          }

          for (int slot = 0; slot < kSlots; slot++) {
            lv_obj_add_flag(slots[slot], LV_OBJ_FLAG_HIDDEN);
          }

          // Falls back to a plain calendar glyph so an entity that gets added to
          // the fetch list without a tag still renders something sensible.
          auto calendar_icon = [](const std::string &cal_name) -> const char * {
            if (cal_name == "family") return "\U000F1823";
            if (cal_name == "birthdays") return "\U000F00EB";
            if (cal_name == "holidays") return "\U000F0240";
            if (cal_name == "f1") return "\U000F07AC";
            if (cal_name == "waste") return "\U000F0A79";
            return "\U000F00ED";
          };

          auto show_event = [&](int slot, int y, const CalendarEvent *event) {
            bool timed = event->start.length() > 11 && event->start[10] == 'T';
            // The icon leads the line so the calendar an event came from is
            // recognisable before reading any of the text.
            std::string when = calendar_icon(event->cal_name);
            when += " ";
            if (timed) {
              when += event->start.substr(11, 5);
              if (event->end.length() > 11 && event->end[10] == 'T') {
                when += " - " + event->end.substr(11, 5);
              }
            } else {
              when += "All day";
            }
            lv_label_set_text(time_labels[slot], when.c_str());
            lv_label_set_text(title_labels[slot], event->summary.c_str());
            lv_obj_set_y(slots[slot], y);
            lv_obj_set_height(rail_lines[slot], lv_pct(100));
            lv_obj_remove_flag(rails[slot], LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(slots[slot], LV_OBJ_FLAG_HIDDEN);
          };

          int slot = 0;
          for (int i = 0; i < today_shown; i++, slot++) {
            show_event(slot, i * kRowHeight, today_events[i]);
          }
          for (int i = 0; i < tomorrow_shown; i++, slot++) {
            show_event(slot,
                       today_block_height + kTomorrowGap + kTomorrowHeaderHeight +
                         i * kRowHeight,
                       tomorrow_events[i]);
          }

          // A row cannot draw outside its own box, so the piece of rail between
          // the panel edge and the first row is a separate segment.
          if (today_shown > 0) {
            lv_obj_remove_flag(id(cal_rail_top), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(cal_rail_top), LV_OBJ_FLAG_HIDDEN);
          }

          // Each day is its own timeline, so stop its line at its last bullet.
          if (today_shown > 0) {
            lv_obj_set_height(rail_lines[today_shown - 1], kRailDotCentre);
          }
          if (tomorrow_shown > 0) {
            lv_obj_set_height(rail_lines[today_shown + tomorrow_shown - 1],
                              kRailDotCentre);
          }

interval:
  - interval: 5min
    then:
      - script.execute: sample_battery

  # The on_time trigger above goes quiet whenever SNTP corrects the clock
  # backwards by less than 15 minutes: ESPHome's cron check skips every second
  # that it has already seen, so it waits for the clock to catch up again. Catch
  # that (and any other missed minute) by comparing what is on the panel against
  # the current time.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              auto now_time = id(local_time).now();
              return now_time.is_valid() && (int) now_time.minute != id(last_rendered_minute);
          then:
            - script.execute: update_dashboard

  - interval: 1min
    then:
      - homeassistant.action:
          action: calendar.get_events
          data:
            # F1 comes from the motorsportcalendars ICS so titles read
            # "F1: FP1 (Dutch Grand Prix)" instead of "Dutch Grand Prix - Practice 1".
            entity_id: calendar.birthdays, calendar.family_calendar, calendar.holidays_in_the_netherlands, calendar.https_files_f1_motorsportcalendars_com_f1_calendar_p1_p2_p3_qualifying_sprint_gp_ics_t_1668761982125, calendar.afvalkalendar_hoogeloon
          data_template:
            start_date_time: >-
              {{ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}
            end_date_time: >-
              {{ (now() + timedelta(days=1)).replace(hour=23, minute=59, second=59, microsecond=0).isoformat() }}
          capture_response: true
          on_success:
            - lambda: |-
                ESP_LOGI("calendar", "Processing calendar response...");

                global_events.clear();
                std::string output;
                serializeJson(response, output);

                bool today = false;
                auto now_time = id(local_time).now();
                struct tm time_info = now_time.to_c_tm();
                char today_buffer[11];
                strftime(today_buffer, sizeof(today_buffer), "%Y-%m-%d", &time_info);
                std::string today_str(today_buffer);

                const char* calendars[] = {"calendar.family_calendar", "calendar.birthdays", "calendar.holidays_in_the_netherlands", "calendar.https_files_f1_motorsportcalendars_com_f1_calendar_p1_p2_p3_qualifying_sprint_gp_ics_t_1668761982125", "calendar.afvalkalendar_hoogeloon"};
                auto ha_data = response["response"];

                for (const char* cal : calendars) {
                    std::string cal_entity(cal);

                    if (ha_data[cal].is<JsonObjectConst>()) {
                        auto events = ha_data[cal]["events"];
                        size_t events_count = events.size();
                        std::string cal_name;

                        if (cal_entity == "calendar.family_calendar") {
                            cal_name = "family";
                        }
                        if (cal_entity == "calendar.birthdays") {
                            cal_name = "birthdays";
                        }
                        if (cal_entity == "calendar.holidays_in_the_netherlands") {
                            cal_name = "holidays";
                        }
                        if (cal_entity == "calendar.https_files_f1_motorsportcalendars_com_f1_calendar_p1_p2_p3_qualifying_sprint_gp_ics_t_1668761982125") {
                            cal_name = "f1";
                        }
                        if (cal_entity == "calendar.afvalkalendar_hoogeloon") {
                            cal_name = "waste";
                        }

                        if (events_count > 0) {
                            ESP_LOGI("calendar", "  + Calendar %s found with %d events", cal, events_count);
                            for (size_t event_number = 0; event_number < events_count; event_number++) {
                                std::string summary = events[event_number]["summary"] | "No Summary";
                                std::string start   = events[event_number]["start"]   | "Unknown Start";
                                std::string end     = events[event_number]["end"]     | "Unknown End";

                                if (start.substr(0, 10) == today_str) {
                                    today = true;
                                } else {
                                    today = false;
                                }

                                CalendarEvent new_event;
                                new_event.cal_name = cal_name;
                                new_event.summary = summary;
                                new_event.start = start;
                                new_event.end = end;
                                new_event.today = today;
                                global_events.push_back(new_event);
                            }
                        } else {
                            ESP_LOGI("calendar", "  + Calendar %s found but it has 0 events.", cal);
                        }
                    } else {
                        ESP_LOGW("calendar", "No events in calendar %s found. Full response: ", cal);
                        ESP_LOGD("calendar", "%s", output.c_str());
                    }
                }

                for (const auto& event : global_events) {
                    ESP_LOGD("calendar", "  + Event: %s (Calendar: %s. Starts: %s, ends: %s, is today: %s)",
                            event.summary.c_str(),
                            event.cal_name.c_str(),
                            event.start.c_str(),
                            event.end.c_str(),
                            event.today ? "Yes" : "No");
                }
                ESP_LOGI("calendar", "Total events stored: %d", global_events.size());
          on_error:
            - lambda: |-
                ESP_LOGE("calendar", "Failed to fetch calendar events from Home Assistant");

# define font to display words
font:
  - file: "gfonts://Inter@700"
    id: font_big
    size: 55
    bpp: 1
  - file: "gfonts://Inter@400"
    id: font_small
    size: 28
    bpp: 1
    # Calendar summaries contain accented characters, which the default
    # GF_Latin_Kernel glyphset does not cover
    glyphsets:
      - GF_Latin_Core
    # Inter does not include the combining double acute (U+030B) from
    # GF_Latin_Core; precomposed ő/ű still render fine.
    ignore_missing_glyphs: true
    extras:
      - file: "fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F00ED", # mdi-calendar, prefixes the date under the clock
        ]
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 40
    bpp: 1
  # Section headers, weekday cells, and the icon + time line of every event
  - file: "gfonts://Inter@700"
    id: font_header
    size: 22
    bpp: 1
    extras:
      - file: "fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F1823", # mdi-human-male-female-child, family calendar
          "\U000F00EB", # mdi-cake-variant, birthdays
          "\U000F0240", # mdi-flag-variant, national holidays
          "\U000F07AC", # mdi-car-sports, F1 sessions
