# ============================================================
# HiFi-ESP32-S3 - Sendspin Configuration
# ============================================================
# ESP32 audio board with PCM5100 DAC, I2S output
# Board revision: G2 (date code 09/25) — no RGB LED, no mic, no OLED display, with Ethernet
# Configured with Sendspin for synchronized multi-room audio
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: office-player
  friendly_name: Office Player
  device_friendly_name: ${friendly_name}
  task_stack_in_psram: "true"
  # No physical LED on this board (Rev G2), but sendspin.yaml hard-requires the `light:`
  # domain to exist (light.turn_on/off action type), so light.yaml stays included below;
  # this just suppresses it from actually firing at runtime.
  media_player_led_control: "false"

  # ----------------------------------------------------------------
  # Original settings (mostly) copied from here:
  # https://github.com/sonocotta/esp32-audio-dock/blob/main/firmware/esphome/1-hifi-esp32/hifi-esp32-s3-idf-sendspin.yaml
  # ----------------------------------------------------------------

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # RGB LED
  rgb_led_pin: GPIO09

  # SPI pins (for display)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13

  # IR Receiver
  ir_rx_pin: GPIO07

  # Display control pins
  display_cs_pin: GPIO39
  display_dc_pin: GPIO40
  display_reset_pin: GPIO38

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret office_player__encryption_key

ota:
  platform: esphome
  password: !secret office_player__ota_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: false
  # Uncomment together with the wifi_network package below
  # priority:
  #   - ethernet
  #   - wifi

# Patched copy of ESPHome 2026.9.1's ethernet component: the upstream W5500 driver mixes polling and
# interrupt SPI transactions, which crashes in spi_bus_lock_bg_exit(). Must match the running
# ESPHome version; drop this once upstream fixes it. See config/components/ethernet/w5500_custom_spi.cpp
external_components:
  - source:
      type: local
      path: components
    components: [ethernet]

# Internal (non-PSRAM) heap headroom — not covered by monitoring.yaml's "Free PSRAM"
# sensor. The w5500 driver's rx buffers must come from internal DMA-capable heap,
# so this is what actually explains "no mem for receive buffer" drops if it happens.
sensor:
  - platform: debug
    free:
      name: "${friendly_name} Heap Free"
    min_free:
      name: "${friendly_name} Heap Min Free"
    fragmentation:
      name: "${friendly_name} Heap Fragmentation"

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: Ethernet IP Address

# ===== Packages =====
# Updating the esparagus_remote pin:
#   1. Diff upstream changes since the current SHA before bumping:
#      https://github.com/sonocotta/esp32-audio-dock/compare/<current_sha>...main
#   2. Grab the new HEAD SHA: curl -s https://api.github.com/repos/sonocotta/esp32-audio-dock/commits/main | jq -r .sha
#   3. Update `ref:` below and bump the date/comment.
#   4. Clear the local package cache so it re-fetches instead of reusing a stale clone:
#      rm -rf config/.esphome/packages/<hash-for-this-package>
#   5. Compile + flash one device first; Sendspin is still experimental upstream, so don't roll to all devices at once.
packages:
  # WiFi is off on purpose: with WiFi and ethernet on the same subnet, lwIP sends part of the
  # traffic out over WiFi. To re-enable it, uncomment the following line:
  # wifi_network: !include network/wifi.yaml

  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    # Pinned to main HEAD as of 2026-10-07 (esp32-audio-dock #187, W5500 clock_speed 8MHz).
    ref: c5dfe5274cc2b6b22ce57e2d1a9368ccbdb20ead
    files:
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin.yaml
      # Optional: OLED displays clock when idling, and track/artist info when playing
      # - firmware/esphome/packages/sendspin-addon-oled.yaml

      - firmware/esphome/packages/light.yaml  # kept in: sendspin.yaml requires the light: domain to exist, see media_player_led_control above
      #- firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      #- firmware/esphome/packages/monitoring-wifi.yaml
      # Optional ethernet (replace wifi config if you use this, you need to exclude OLED package if you do this to free up SPI bus)
      - firmware/esphome/packages/ethernet-w5500.yaml

  # # Debug/local development fallback:
  # sendspin: !include packages/sendspin.yaml
  # oled: !include packages/sendspin-addon-oled.yaml
  # audio: !include packages/audio.yaml
  # light: !include packages/light.yaml
  # ir_receiver: !include packages/ir-receiver.yaml
  # monitoring: !include packages/monitoring.yaml
  # monitoring_wifi: !include packages/monitoring-wifi.yaml
  # # ethernet: !include packages/ethernet-w5500.yaml
