substitutions:
  name: mic-satellite-office
  friendly_name: Office Satellite
  device_friendly_name: ${friendly_name}
packages:
  m5stack.atom-echo-voice-assistant: github://esphome/wake-word-voice-assistants/m5stack-atom-echo/m5stack-atom-echo.yaml@26.6.1
  # Also puts a password on the upstream package's open fallback AP
  wifi_network: !include network/wifi.yaml
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
esp32:
  framework:
    advanced:
      sram1_as_iram: true

api:
  encryption:
    key: !secret apikey_m5stack_atom_echo

ota:
  - id: !extend ota_esphome
    encryption:

switch:
  # Idle standby glow off by default; listening/thinking/speaking/error LED
  # states are separate handlers and are unaffected by this.
  - id: !extend use_listen_light
    restore_mode: ALWAYS_OFF
